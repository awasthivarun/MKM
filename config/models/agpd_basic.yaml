composition_parameterizations:
  shared:
    x_reference: 0.50
    models:
      CO_BF_ER_LH:
        slopes: {}

  linear_xAg:
    x_reference: 0.50
    models:
      CO_BF_ER_LH:
        slopes:
          deltaG1_0:
            distribution: truncated_normal 
            mu: 0.0
            sigma: 1
            lower: 0 # Ensemble effects, reducing binding strength of CO with increasing Ag content
            upper: 1 
          deltaG4_0:
            distribution: truncated_normal
            mu: 0.0
            sigma: 1
            lower: -1
            upper: 0 # DFT supports stronger OH binding on Pd with increasing Ag content 
          deltaG5_0:
            distribution: truncated_normal
            mu: 0.0
            sigma: 1
            lower: -10 # Hitting the wall
            upper: 0 # DFT supports stronger OH binding on Pd with increasing Ag content 
          Gact1_0: # (Relaxed right now) Activation energy of CO binding on Pd should not be a function of surface composition
            distribution: truncated_normal
            mu: 0.0
            sigma: 1
            lower: -0.40
            upper: 0.40
          Gact2_BF_0: # Large amount of change allowed in BF activation energy 
            distribution: truncated_normal
            mu: 0.0
            sigma: 1
            lower: -0.40
            upper: 0.40
          Gact2_ER_0: # Large amount of change allowed in ER activation energy
            distribution: truncated_normal
            mu: 0.0
            sigma: 1
            lower: -0.40
            upper: 0.0 # Activation energy should decrease if CO binds weaker
          Gact2_LH_0: # Large amount of change allowed in LH activation energy
            distribution: truncated_normal
            mu: 0.0
            sigma: 1
            lower: -0.40
            upper: 1 # Hitting the wall 
          beta_2_BF: # Do not change - this is percentage change
            distribution: truncated_normal
            mu: 0.0
            sigma: 1
            lower: -1
            upper: 1
          beta_2_ER: # Do not change - this is percentage change
            distribution: truncated_normal
            mu: 0.0
            sigma: 1
            lower: -1
            upper: 1
          q: # Do not change - this is percentage change
            distribution: truncated_normal
            mu: 0.0
            sigma: 1
            lower: -1
            upper: 1

likelihood:
  name: rate_normal
  sigma_form: sigma_abs + sigma_rel * model_rate
  supported_error_structures:
    - shared
    - material
  sigma_abs_prior_median_s_inv: 0.0002
  sigma_abs_prior_log_sd: 1.0
  sigma_rel_prior_median: 0.18
  sigma_rel_prior_log_sd: 0.75


prior_profiles:
