          mu: 0.5
          sigma: 1
          lower: 0.0
          upper: 1.0
        beta_2_ER:
          distribution: truncated_normal
          mu: 0.5
          sigma: 1
          lower: 0.0
          upper: 1.0
        q:
          distribution: truncated_normal
          mu: 0.5
          sigma: 1
          lower: 0.0
          upper: 1.0
        Gact1_0:
          distribution: truncated_normal
          mu: 0.5
          sigma: 1
          lower: 0.2
          upper: 0.7
        Gact2_BF_0:
          distribution: truncated_normal
          mu: 0.7
