dataset_name: AgPd_COOx_basic
temperature_K: 293.15

gas:
  standard_state_pressure_bar: 1.0
  total_pressure_bar: 1.0

electrolyte:
  standard_state_concentration_M: 1.0
  activity_model: ideal_molarity

surface_composition:
  Pd100:
    Ag_fraction: 0.00
    Pd_fraction: 1.00
  Ag10Pd90:
    Ag_fraction: 0.10
    Pd_fraction: 0.90
  Ag25Pd75:
    Ag_fraction: 0.25
    Pd_fraction: 0.75
  Ag50Pd50:
    Ag_fraction: 0.50
    Pd_fraction: 0.50
  Ag75Pd25:
    Ag_fraction: 0.75
    Pd_fraction: 0.25
  Ag90Pd10:
    Ag_fraction: 0.90
    Pd_fraction: 0.10

surface_assumptions:
  surface_composition_equals_bulk: true
  random_mixing: true

composition_parameterizations:
  shared:
    x_reference: 0.50
    models:
      CO_BF_ER_LH:
        slopes: {}

  independent:
    # One independent mechanism-parameter set per material in a single joint fit.
    # The intended likelihood uses one shared sigma_abs / sigma_rel pair across all materials.
    models:
      CO_BF_ER_LH:
        independent_materials: true

  linear_xAg:
    x_reference: 0.50
    models:
      CO_BF_ER_LH:
        slopes:
          deltaG1_0:
            distribution: truncated_normal 
            mu: 0
            sigma: 0.1 # Small slopes encouraged
            lower: 0 # Ensemble effects, reducing binding strength of CO with increasing Ag content
            upper: 1 
          deltaG4_0:
            distribution: truncated_normal
            mu: 0
            sigma: 0.1 # Small slopes encouraged
            lower: -1
            upper: 0 # DFT supports stronger OH binding on Pd with increasing Ag content 
          deltaG5_0:
            distribution: truncated_normal
            mu: 0
            sigma: 0.2 # Small slopes encouraged, but larger than deltaG4 slopes (DFT)
            lower: -1 
            upper: 0 # DFT supports stronger OH binding on Ag with increasing Ag content 
          Gact1_0: # Centered around zero
            distribution: truncated_normal
            mu: 0
            sigma: 0.1
            lower: -0.4
            upper: 0.4
          Gact2_BF_0: # Centered around zero
            distribution: truncated_normal
            mu: 0
            sigma: 0.1 
            lower: -0.4
            upper: 0.4
          Gact2_ER_0: # Centered around zero
            distribution: truncated_normal
            mu: 0
            sigma: 0.1 
            lower: -0.4
            upper: 0.4
          Gact2_LH_0: # Centered around zero
            distribution: truncated_normal
            mu: 0
            sigma: 0.1 
            lower: -0.4
            upper: 1 # Computationally permissive slope bound; verify sensitivity if posterior mass approaches it 
          beta_2_BF: # Normalized fraction of the maximum symmetric bounded slope
            distribution: truncated_normal
            mu: 0
            sigma: 1
            lower: -1
            upper: 1
          beta_2_ER: # Normalized fraction of the maximum symmetric bounded slope
            distribution: truncated_normal
            mu: 0
            sigma: 1
            lower: -1
            upper: 1
          q: # Normalized fraction of the maximum symmetric bounded slope
            distribution: truncated_normal
            mu: 0
            sigma: 1
            lower: -1
            upper: 1

likelihood:
  name: rate_normal
  sigma_form: sigma_abs + sigma_rel * model_rate
  supported_error_structures:
    - shared
    - material
  sigma_abs_prior_median_s_inv: 0.0002
  sigma_abs_prior_log_sd: 0.5
  sigma_rel_prior_median: 0.2
  sigma_rel_prior_log_sd: 0.5


