dataset_name: AgPd_COOx_basic
temperature_K: 293.15

gas:
  standard_state_pressure_bar: 1.0
  total_pressure_bar: 1.0

electrolyte:
  standard_state_concentration_M: 1.0
  activity_model: ideal_molarity

surface_composition:
  Pd100:
    Ag_fraction: 0.00
    Pd_fraction: 1.00
  Ag10Pd90:
    Ag_fraction: 0.10
    Pd_fraction: 0.90
  Ag25Pd75:
    Ag_fraction: 0.25
    Pd_fraction: 0.75
  Ag50Pd50:
    Ag_fraction: 0.50
    Pd_fraction: 0.50
  Ag75Pd25:
    Ag_fraction: 0.75
    Pd_fraction: 0.25
  Ag90Pd10:
    Ag_fraction: 0.90
    Pd_fraction: 0.10

surface_assumptions:
  surface_composition_equals_bulk: true
  random_mixing: true

composition_parameterizations:
  shared:
    x_reference: 0.50
    models:
      BF_LH:
        slopes: {}
      CO_BF_ER_LH:
        slopes: {}

  linear_xAg:
    x_reference: 0.50
    models:
      CO_BF_ER_LH:
        slopes:
          deltaG1_0:
            distribution: normal
            mu: 0.0
            sigma: 0.10
          deltaG4_0:
            distribution: normal
            mu: 0.0
            sigma: 0.10
          deltaG5_0:
            distribution: truncated_normal
            mu: 0.0
            sigma: 0.10
            lower: -0.20
            upper: 0.40
          Gact2_BF_0:
            distribution: truncated_normal
            mu: 0.0
            sigma: 0.10
            lower: -0.20
            upper: 0.40
          Gact2_ER_0:
            distribution: normal
            mu: 0.0
            sigma: 0.10

likelihood:
  name: rate_normal
  sigma_form: sigma_abs + sigma_rel * model_rate
  supported_error_structures:
    - shared
    - material
  sigma_abs_prior_median_s_inv: 0.0002
  sigma_abs_prior_log_sd: 1.0
  sigma_rel_prior_median: 0.18
  sigma_rel_prior_log_sd: 0.75

prior_profiles:
  Ag10Pd90: &legacy_alloy_prior_profile
    BF: &legacy_bf_prior
      provenance: legacy_tuned_for_multimodality
      parameters:
        deltaG1_0:
          distribution: normal
          mu: -0.4
          sigma: 0.2
        deltaG4_0:
          distribution: normal
          mu: 0.0
          sigma: 0.2
        deltaG5_0:
          distribution: normal
          mu: 0.0
          sigma: 0.2
        beta_2:
          distribution: uniform
          lower: 0.0
          upper: 1.0
        q:
          distribution: uniform
          lower: 0.0
          upper: 1.0
        Gact2_0:
          distribution: truncated_normal
          mu: 0.7
          sigma: 0.2
          lower: 0.0

    BF_LH: &legacy_bf_lh_prior
      provenance: legacy_tuned_for_multimodality
      parameters:
        deltaG1_0:
          distribution: normal
          mu: -0.4
          sigma: 0.2
        deltaG4_0:
          distribution: normal
          mu: 0.0
          sigma: 0.2
        deltaG5_0:
          distribution: normal
          mu: 0.0
          sigma: 0.2
        beta_2:
          distribution: uniform
          lower: 0.0
          upper: 1.0
        q:
          distribution: uniform
          lower: 0.0
          upper: 1.0
        Gact2_BF_0:
          distribution: truncated_normal
          mu: 0.7
          sigma: 0.2
          lower: 0.0
        Gact2_LH_0:
          distribution: truncated_normal
          mu: 0.7
          sigma: 0.2
          lower: 0.0

    CO_BF_ER_LH: &legacy_co_bf_er_lh_prior
      provenance: legacy_tuned_for_multimodality
      parameters:
        deltaG1_0:
          distribution: truncated_normal
          mu: -0.4
          sigma: 0.2
          lower: -0.4
          upper: 0.0
        deltaG4_0:
          distribution: normal
          mu: 0.0
          sigma: 0.2
        deltaG5_0:
          distribution: normal
          mu: 0.0
          sigma: 0.2
        beta_2_BF:
          distribution: uniform
          lower: 0.0
          upper: 0.1
        beta_2_ER:
          distribution: uniform
          lower: 0.0
          upper: 1.0
        q:
          distribution: uniform
          lower: 0.0
          upper: 1.0
        Gact1_0:
          distribution: truncated_normal
          mu: 0.7
          sigma: 0.2
          lower: 0.0
          upper: 1.0
        Gact2_BF_0:
          distribution: truncated_normal
          mu: 0.7
          sigma: 0.2
          lower: 0.5
          upper: 1.0
        Gact2_ER_0:
          distribution: truncated_normal
          mu: 0.7
          sigma: 0.2
          lower: 0.5
          upper: 0.8
        Gact2_LH_0:
          distribution: truncated_normal
          mu: 0.7
          sigma: 0.2
          lower: 0.5
          upper: 1.0

  Ag25Pd75: *legacy_alloy_prior_profile
  Ag50Pd50: *legacy_alloy_prior_profile
  Ag75Pd25: *legacy_alloy_prior_profile
  Ag90Pd10: *legacy_alloy_prior_profile

  Pd100:
    BF_LH: *legacy_bf_lh_prior
    CO_BF_ER_LH: *legacy_co_bf_er_lh_prior
