  Ag25Pd75: *alloy_prior_profile
  Ag50Pd50: *alloy_prior_profile
  Ag75Pd25: *alloy_prior_profile
  Ag90Pd10: *alloy_prior_profile

  Pd100:
    CO_ER_LH:
      provenance: legacy_tuned_for_multimodality
      parameters:
        deltaG1_0:
          distribution: truncated_normal
          mu: 0.0
          sigma: 2
          lower: -0.5
          upper: 0.5
        deltaG4_0:
          distribution: truncated_normal
          mu: 0.0
