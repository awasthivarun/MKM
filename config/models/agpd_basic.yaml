dataset_name: AgPd_COOx_basic
temperature_K: 293.15

gas:
  standard_state_pressure_bar: 1.0
  total_pressure_bar: 1.0

electrolyte:
  standard_state_concentration_M: 1.0
  activity_model: ideal_molarity

surface_composition:
  Pd100:
    Ag_fraction: 0.00
    Pd_fraction: 1.00
  Ag10Pd90:
    Ag_fraction: 0.10
    Pd_fraction: 0.90
  Ag25Pd75:
    Ag_fraction: 0.25
    Pd_fraction: 0.75
  Ag50Pd50:
    Ag_fraction: 0.50
    Pd_fraction: 0.50
  Ag75Pd25:
    Ag_fraction: 0.75
    Pd_fraction: 0.25
  Ag90Pd10:
    Ag_fraction: 0.90
    Pd_fraction: 0.10

surface_assumptions:
  surface_composition_equals_bulk: true
  random_mixing: true

## Do not use - there is not much justification to use CO coverage caps - much cleaner to work with elementary reactions
co_coverage_cap:
  # Fixed molecular CO coverage caps for the two fixed-cap models. The fitted-cap calibration below ignores these values.
  # CO adsorption is multiplied by 1 - theta_CO / theta_CO_max while the ordinary Pd site balance
  # theta_empty_Pd + theta_OH_Pd + theta_CO = 1 is retained.
  # Kept material-resolved so the assumed packing limit can vary by composition.
  Pd100: 0.66
  Ag10Pd90: 0.66
  Ag25Pd75: 0.66
  Ag50Pd50: 0.66
  Ag75Pd25: 0.66
  Ag90Pd10: 0.66

## Do not use -  Sensitivity analysis to see best values of CO coverage caps. 
fitted_cap_calibration:
  x_reference: 0.50
  theta_CO_max_prior:
    distribution: uniform
    lower: 0.3
    upper: 1.0
  parameters:
    deltaG1_0:
      distribution: truncated_normal
      mu: -0.1148115753
      sigma: 1e-6 # 0.0004718200
      lower: -0.3
      upper: 0.5
    deltaG4_0:
      distribution: truncated_normal
      mu: 0.1013418252
      sigma: 1e-6 # 0.0013542392
      lower: -2.0
      upper: 1.0
    deltaG5_0:
      distribution: truncated_normal
      mu: -0.0172893204
      sigma: 1e-6 # 0.0016379510
      lower: -2.0
      upper: 1.0
    beta_2_BF:
      distribution: truncated_normal
      mu: 0.0013053415
      sigma: 1e-6 # 0.0013372187
      lower: 0.0
      upper: 0.2
    beta_2_ER:
      distribution: truncated_normal
      mu: 0.3016144903
      sigma: 1e-6 # 0.0013372187
      lower: 0.0
      upper: 1.0
    q:
      distribution: truncated_normal
      mu: 0.3502937039
      sigma: 1e-6 # 0.0044993463
      lower: 0.0
      upper: 1.0
    Gact1_0:
      distribution: truncated_normal
      mu: 0.5761783653
      sigma: 1e-6 # 0.0018413634
      lower: 0.5
      upper: 0.7
    Gact2_BF_0:
      distribution: truncated_normal
      mu: 0.6800642823
      sigma: 1e-6 # 0.0010748812
      lower: 0.6
      upper: 1.0
    Gact2_ER_0:
      distribution: truncated_normal
      mu: 0.7338166233
      sigma: 1e-6 # 0.0010078313
      lower: 0.6
      upper: 1.0
    Gact2_LH_0:
      distribution: truncated_normal
      mu: 0.7382236823
      sigma: 1e-6 # 0.0080427843
      lower: 0.6
      upper: 1
  slopes:
    deltaG1_0:
      distribution: truncated_normal
      mu: 0.0314833021
      sigma: 1e-6 # 0.0011669641
      lower: 0
      upper: 1
    deltaG4_0:
      distribution: truncated_normal
      mu: -0.0304713507
      sigma: 1e-6 # 0.0038320798
      lower: -1
      upper: 0
    deltaG5_0:
      distribution: truncated_normal
      mu: -0.0393413446
      sigma: 1e-6 # 0.0043592583
      lower: -1
      upper: 0
    Gact1_0:
      distribution: truncated_normal
      mu: 0.0592870019
      sigma: 1e-6 # 0.0048239057
      lower: -0.4
      upper: 0.4
    Gact2_BF_0:
      distribution: truncated_normal
      mu: 0.0525695525
      sigma: 1e-6 #0.0029211622
      lower: -0.4
      upper: 0.4
    Gact2_ER_0:
      distribution: truncated_normal
      mu: -0.0432875699
      sigma: 1e-6 #0.0023418291
      lower: -0.4
      upper: 0
    Gact2_LH_0:
      distribution: truncated_normal
      mu: 0.0225462853
      sigma: 1e-6 # 0.0167964695
      lower: -0.4
      upper: 1
    beta_2_BF:
      distribution: truncated_normal
      mu: -0.0665473523
      sigma: 1e-6 # 0.5439154205
      lower: -1
      upper: 1
    beta_2_ER:
      distribution: truncated_normal
      mu: -0.0397812232
      sigma: 1e-6 #0.0176944658
      lower: -1
      upper: 1
    q:
      distribution: truncated_normal
      mu: 0.1739582433
      sigma: 1e-6 # 0.0203224011
      lower: -1
      upper: 1

composition_parameterizations:
  shared:
    x_reference: 0.50
    models:
      CO_BF_ER_LH:
        slopes: {}

  linear_xAg:
    x_reference: 0.50
    models:
      CO_BF_ER_LH:
        slopes:
          deltaG1_0:
            distribution: truncated_normal 
            mu: 0
            sigma: 0.1 # Small slopes encouraged
            lower: 0 # Ensemble effects, reducing binding strength of CO with increasing Ag content
            upper: 1 
          deltaG4_0:
            distribution: truncated_normal
            mu: 0
            sigma: 0.1 # Small slopes encouraged
            lower: -1
            upper: 0 # DFT supports stronger OH binding on Pd with increasing Ag content 
          deltaG5_0:
            distribution: truncated_normal
            mu: 0
            sigma: 0.2 # Small slopes encouraged, but larger than deltaG4 slopes (DFT)
            lower: -1 
            upper: 0 # DFT supports stronger OH binding on Ag with increasing Ag content 
          Gact1_0: # Centered around zero
            distribution: truncated_normal
            mu: 0
            sigma: 0.1
            lower: -0.4
            upper: 0.4
          Gact2_BF_0: # Centered around zero
            distribution: truncated_normal
            mu: 0
            sigma: 0.1 
            lower: -0.4
            upper: 0.4
          Gact2_ER_0: # Centered around zero
            distribution: truncated_normal
            mu: 0
            sigma: 0.1 
            lower: -0.4
            upper: 0.4
          Gact2_LH_0: # Centered around zero
            distribution: truncated_normal
            mu: 0
            sigma: 0.1 
            lower: -0.4
            upper: 1 # Increased to prevent hitting the wall 
          beta_2_BF: # Do not change - this is percentage change
            distribution: truncated_normal
            mu: 0
            sigma: 1
            lower: -1
            upper: 1
          beta_2_ER: # Do not change - this is percentage change
            distribution: truncated_normal
            mu: 0
            sigma: 1
            lower: -1
            upper: 1
          q: # Do not change - this is percentage change
            distribution: truncated_normal
            mu: 0
            sigma: 1
            lower: -1
            upper: 1

likelihood:
  name: rate_normal
  sigma_form: sigma_abs + sigma_rel * model_rate
  supported_error_structures:
    - shared
    - material
  sigma_abs_prior_median_s_inv: 0.0002
  sigma_abs_prior_log_sd: 0.5
  sigma_rel_prior_median: 0.2
  sigma_rel_prior_log_sd: 0.5


prior_profiles:
  Ag10Pd90: &shared_prior_profile
    CO_BF_ER_LH:
      provenance: weak_regularization
      parameters:
        deltaG1_0: # Wide range for CO ads energy 
          distribution: truncated_normal
          mu: -0.2 # CO strong binding
          sigma: 0.2
          lower: -0.5
          upper: 0.05 # OOM analysis - dead zone
        deltaG4_0: # Wide range for OH ads energy on Pd
          distribution: truncated_normal
          mu: 0
          sigma: 0.2
          lower: -0.25 # OOM analysis - dead zone
          upper: 0.5
        deltaG5_0: # Wide range for OH ads energy on Ag
          distribution: truncated_normal
          mu: 0
          sigma: 0.2
          lower: -0.5
          upper: 0.5
        Gact1_0: # Flat reasonable bounds
          distribution: truncated_normal
          mu: 0.5
          sigma: 0.1
          lower: 0.3
          upper: 0.7
        Gact2_BF_0: # Flat reasonable bounds
          distribution: truncated_normal
          mu: 0.7
          sigma: 0.1
          lower: 0.6 
          upper: 1.0 
        Gact2_ER_0: # Flat reasonable bounds
          distribution: truncated_normal
          mu: 0.7
          sigma: 0.1
          lower: 0.6
          upper: 1.0
        Gact2_LH_0: # Flat reasonable bounds
          distribution: truncated_normal
          mu: 0.7
          sigma: 0.1
          lower: 0.6
          upper: 1.0
        beta_2_BF: # Flat unrestricted
          distribution: truncated_normal
          mu: 0.5
          sigma: 1
          lower: 0
          upper: 1
        beta_2_ER: # Flat unrestricted
          distribution: truncated_normal
          mu: 0.5
          sigma: 1
          lower: 0
          upper: 1
        q: # Flat unrestricted
          distribution: truncated_normal
          mu: 0.5
          sigma: 1
          lower: 0
          upper: 1

  Ag25Pd75: *shared_prior_profile
  Ag50Pd50: *shared_prior_profile
  Ag75Pd25: *shared_prior_profile
  Ag90Pd10: *shared_prior_profile
  Pd100: *shared_prior_profile
