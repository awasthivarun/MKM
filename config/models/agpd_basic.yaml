dataset_name: AgPd_COOx_basic
temperature_K: 293.15

gas:
  standard_state_pressure_bar: 1.0
  total_pressure_bar: 1.0

electrolyte:
  standard_state_concentration_M: 1.0
  activity_model: ideal_molarity

surface_composition:
  Pd100:
    Ag_fraction: 0.00
    Pd_fraction: 1.00
  Ag10Pd90:
    Ag_fraction: 0.10
    Pd_fraction: 0.90
  Ag25Pd75:
    Ag_fraction: 0.25
    Pd_fraction: 0.75
  Ag50Pd50:
    Ag_fraction: 0.50
    Pd_fraction: 0.50
  Ag75Pd25:
    Ag_fraction: 0.75
    Pd_fraction: 0.25
  Ag90Pd10:
    Ag_fraction: 0.90
    Pd_fraction: 0.10

surface_assumptions:
  surface_composition_equals_bulk: true
  random_mixing: true

co_coverage_cap:
  # Fixed molecular CO coverage caps for the two fixed-cap models. The fitted-cap calibration below ignores these values.
  # CO adsorption is multiplied by 1 - theta_CO / theta_CO_max while the ordinary Pd site balance
  # theta_empty_Pd + theta_OH_Pd + theta_CO = 1 is retained.
  # Kept material-resolved so the assumed packing limit can vary by composition.
  Pd100: 0.66
  Ag10Pd90: 0.66
  Ag25Pd75: 0.66
  Ag50Pd50: 0.66
  Ag75Pd25: 0.66
  Ag90Pd10: 0.66

# Same-data empirical-Bayes sensitivity experiment. These narrow chemistry priors are the posterior
# means/SDs from CO_BF_ER_LH_capped_Ag10_no_BF. Do not use this run for formal LOO/WAIC comparison
# against models whose priors were specified independently of these data.
fitted_cap_calibration:
  x_reference: 0.50
  theta_CO_max_prior:
    distribution: uniform
    lower: 0.7
    upper: 1.0
  parameters:
    deltaG1_0:
      distribution: truncated_normal
      mu: -0.1148115753
      sigma: 0.0004718200
      lower: -2.0
      upper: 0.5
    deltaG4_0:
      distribution: truncated_normal
      mu: 0.1013418252
      sigma: 0.0013542392
      lower: -2.0
      upper: 1.0
    deltaG5_0:
      distribution: truncated_normal
      mu: -0.0172893204
      sigma: 0.0016379510
      lower: -2.0
      upper: 1.0
    beta_2_BF:
      distribution: truncated_normal
      mu: 0.0013053415
      sigma: 0.0013372187
      lower: 0.0
      upper: 0.2
    beta_2_ER:
      distribution: truncated_normal
      mu: 0.3016144903
      sigma: 0.0047486890
      lower: 0.0
      upper: 1.0
    q:
      distribution: truncated_normal
      mu: 0.3502937039
      sigma: 0.0044993463
      lower: 0.0
      upper: 1.0
    Gact1_0:
      distribution: truncated_normal
      mu: 0.5761783653
      sigma: 0.0018413634
      lower: 0.5
      upper: 0.7
    Gact2_BF_0:
      distribution: truncated_normal
      mu: 0.6800642823
      sigma: 0.0010748812
      lower: 0.6
      upper: 1.0
    Gact2_ER_0:
      distribution: truncated_normal
      mu: 0.7338166233
      sigma: 0.0010078313
      lower: 0.6
      upper: 1.0
    Gact2_LH_0:
      distribution: truncated_normal
      mu: 0.7382236823
      sigma: 0.0080427843
      lower: 0.6
      upper: 1.0
  slopes:
    deltaG1_0:
      distribution: truncated_normal
      mu: 0.0314833021
      sigma: 0.0011669641
      lower: 0.0
      upper: 1.0
    deltaG4_0:
      distribution: truncated_normal
      mu: -0.0304713507
      sigma: 0.0038320798
      lower: -1.0
      upper: 0.0
    deltaG5_0:
      distribution: truncated_normal
      mu: -0.0393413446
      sigma: 0.0043592583
      lower: -10.0
      upper: 0.0
    Gact1_0:
      distribution: truncated_normal
      mu: 0.0592870019
      sigma: 0.0048239057
      lower: -0.4
      upper: 0.4
    Gact2_BF_0:
      distribution: truncated_normal
      mu: 0.0525695525
      sigma: 0.0029211622
      lower: -0.4
      upper: 0.4
    Gact2_ER_0:
      distribution: truncated_normal
      mu: -0.0432875699
      sigma: 0.0023418291
      lower: -0.4
      upper: 0.0
    Gact2_LH_0:
      distribution: truncated_normal
      mu: 0.0225462853
      sigma: 0.0167964695
      lower: -0.4
      upper: 1.0
    beta_2_BF:
      distribution: truncated_normal
      mu: -0.0665473523
      sigma: 0.5439154205
      lower: -1.0
      upper: 1.0
    beta_2_ER:
      distribution: truncated_normal
      mu: -0.0397812232
      sigma: 0.0176944658
      lower: -1.0
      upper: 1.0
    q:
      distribution: truncated_normal
      mu: 0.1739582433
      sigma: 0.0203224011
      lower: -1.0
