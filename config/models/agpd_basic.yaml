        deltaG1_0:
          distribution: normal
          mu: -0.4
          sigma: 0.2
        deltaG4_0:
          distribution: normal
          mu: 0.0
          sigma: 0.2
        deltaG5_0:
          distribution: normal
          mu: 0.0
          sigma: 0.2
        beta_2:
          distribution: uniform
          lower: 0.0
          upper: 1.0
        q:
