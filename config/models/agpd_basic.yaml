dataset_name: AgPd_COOx_basic
temperature_K: 293.15

gas:
  standard_state_pressure_bar: 1.0
  total_pressure_bar: 1.0

electrolyte:
  standard_state_concentration_M: 1.0
  activity_model: ideal_molarity

surface_composition:
  Pd100:
    Ag_fraction: 0.00
    Pd_fraction: 1.00
  Ag10Pd90:
    Ag_fraction: 0.10
    Pd_fraction: 0.90
  Ag25Pd75:
    Ag_fraction: 0.25
    Pd_fraction: 0.75
  Ag50Pd50:
    Ag_fraction: 0.50
    Pd_fraction: 0.50
  Ag75Pd25:
    Ag_fraction: 0.75
    Pd_fraction: 0.25
  Ag90Pd10:
    Ag_fraction: 0.90
    Pd_fraction: 0.10

surface_assumptions:
  surface_composition_equals_bulk: true
  random_mixing: true

composition_parameterizations:
  shared:
    x_reference: 0.50
    models:
      BF_LH:
        slopes: {}
      CO_BF_ER_LH:
        slopes: {}

  linear_selected_energies:
    x_reference: 0.50
    models:
      CO_BF_ER_LH:
        slopes:
          deltaG1_0: &slope_deltaG1
            distribution: normal
            mu: 0.0
            sigma: 0.10
          deltaG4_0: &slope_deltaG4
            distribution: normal
            mu: 0.0
            sigma: 0.10
          deltaG5_0: &slope_deltaG5
            distribution: truncated_normal
            mu: 0.0
            sigma: 0.10
            lower: -0.20
            upper: 0.40
          Gact2_BF_0: &slope_Gact2_BF
            distribution: truncated_normal
            mu: 0.0
            sigma: 0.10
            lower: -0.20
            upper: 0.40
          Gact2_ER_0: &slope_Gact2_ER
            distribution: normal
            mu: 0.0
            sigma: 0.10

  linear_energies:
      x_reference: 0.50
      models:
        CO_BF_ER_LH:
          slopes:
            deltaG1_0:
              distribution: truncated_normal
              mu: 0.0
              sigma: 0.05
              lower: -0.40
              upper: 0.40
            deltaG4_0:
              distribution: truncated_normal
              mu: 0.0
              sigma: 0.05
              lower: -0.40
              upper: 0.40
            deltaG5_0:
              distribution: truncated_normal
              mu: 0.0
              sigma: 0.05
              lower: -0.15
              upper: 0.15
            Gact1_0:
              distribution: truncated_normal
              mu: 0.0
              sigma: 0.10
              lower: -0.40
              upper: 0.40
            Gact2_BF_0:
              distribution: truncated_normal
              mu: 0.0
              sigma: 0.05
              lower: -0.40
              upper: 0.40
            Gact2_ER_0:
              distribution: truncated_normal
              mu: 0.0
              sigma: 0.05
              lower: -0.40
              upper: 0.40
            Gact2_LH_0:
              distribution: truncated_normal
              mu: 0.0
              sigma: 0.05
              lower: -0.40
              upper: 0.40

  linear_xAg:
    x_reference: 0.50
    models:
      CO_BF_ER_LH:
        slopes:
          deltaG1_0:
            distribution: truncated_normal 
            mu: 0.0
            sigma: 1
            lower: 0 # Ensemble effects, reducing binding strength of CO with increasing Ag content
            upper: 1 
          deltaG4_0:
            distribution: truncated_normal
            mu: 0.0
            sigma: 1
            lower: -1
            upper: 1
          deltaG5_0:
            distribution: truncated_normal
            mu: 0.0
            sigma: 1
            lower: -1
            upper: 1
          Gact1_0: # Activation energy of CO binding on Pd should not be a function of surface composition
            distribution: truncated_normal
            mu: 0.0
            sigma: 1
            lower: -1e-4
            upper: 1e-4
          Gact2_BF_0: # Large amount of change allowed in BF activation energy 
            distribution: truncated_normal
            mu: 0.0
            sigma: 1
            lower: -0.40
            upper: 0.40
          Gact2_ER_0: # Large amount of change allowed in ER activation energy (but if CO binds weaker, ER activation energy should decrease)
            distribution: truncated_normal
            mu: 0.0
            sigma: 1
            lower: -0.40
            upper: 0.40 # Maybe set to 0? 
          Gact2_LH_0: # Large amount of change allowed in LH activation energy
            distribution: truncated_normal
            mu: 0.0
            sigma: 1
            lower: -0.40
            upper: 0.40
          beta_2_BF: # Allowed to change 
            distribution: truncated_normal
            mu: 0.0
            sigma: 1
            lower: -1
            upper: 1
          beta_2_ER: # Allowed to change
            distribution: truncated_normal
            mu: 0.0
            sigma: 1
            lower: -1
            upper: 1
          q: # Allowed to change
            distribution: truncated_normal
            mu: 0.0
            sigma: 1
            lower: -1
            upper: 1

  linear_dG1:
    x_reference: 0.50
    models:
      CO_BF_ER_LH:
        slopes:
          deltaG1_0: *slope_deltaG1

  linear_dG4:
    x_reference: 0.50
    models:
      CO_BF_ER_LH:
        slopes:
          deltaG4_0: *slope_deltaG4

  linear_dG5:
    x_reference: 0.50
    models:
      CO_BF_ER_LH:
        slopes:
          deltaG5_0: *slope_deltaG5

  linear_thermo:
    x_reference: 0.50
    models:
      CO_BF_ER_LH:
        slopes:
          deltaG1_0: *slope_deltaG1
          deltaG4_0: *slope_deltaG4
          deltaG5_0: *slope_deltaG5

  linear_GactBF:
    x_reference: 0.50
    models:
      CO_BF_ER_LH:
        slopes:
          Gact2_BF_0: *slope_Gact2_BF

  linear_GactER:
    x_reference: 0.50
    models:
      CO_BF_ER_LH:
        slopes:
          Gact2_ER_0: *slope_Gact2_ER

  linear_oxidation_barriers:
    x_reference: 0.50
    models:
      CO_BF_ER_LH:
        slopes:
          Gact2_BF_0: *slope_Gact2_BF
          Gact2_ER_0: *slope_Gact2_ER
          Gact2_LH_0:
            distribution: truncated_normal
            mu: 0.0
            sigma: 0.10
            lower: -0.20
            upper: 0.40

likelihood:
  name: rate_normal
  sigma_form: sigma_abs + sigma_rel * model_rate
  supported_error_structures:
    - shared
    - material
  sigma_abs_prior_median_s_inv: 0.0002
  sigma_abs_prior_log_sd: 1.0
  sigma_rel_prior_median: 0.18
  sigma_rel_prior_log_sd: 0.75

prior_profiles:
  Ag10Pd90: &legacy_alloy_prior_profile
    BF: &legacy_bf_prior
      provenance: legacy_tuned_for_multimodality
      parameters:
        deltaG1_0:
          distribution: normal
          mu: -0.4
          sigma: 0.2
        deltaG4_0:
          distribution: normal
          mu: 0.0
          sigma: 0.2
        deltaG5_0:
          distribution: normal
          mu: 0.0
          sigma: 0.2
        beta_2:
          distribution: uniform
          lower: 0.0
          upper: 1.0
        q:
          distribution: uniform
          lower: 0.0
          upper: 1.0
        Gact2_0:
          distribution: truncated_normal
          mu: 0.7
          sigma: 0.2
          lower: 0.0

    CO_ER_LH:
      provenance: legacy_tuned_for_multimodality
      parameters:
        deltaG1_0:
          distribution: truncated_normal
          mu: -0.4
          sigma: 0.2
          lower: -0.4
          upper: 0.0
        deltaG4_0:
          distribution: normal
          mu: 0.0
          sigma: 0.2
        beta_2_ER:
          distribution: uniform
          lower: 0.0
          upper: 1.0
        Gact1_0:
          distribution: truncated_normal
          mu: 0.7
          sigma: 0.2
          lower: 0.0
          upper: 1.0
        Gact2_ER_0:
          distribution: truncated_normal
          mu: 0.7
          sigma: 0.2
          lower: 0.5
          upper: 0.8
        Gact2_LH_0:
          distribution: truncated_normal
          mu: 0.7
          sigma: 0.2
          lower: 0.5
          upper: 1.0

    BF_LH: &legacy_bf_lh_prior
      provenance: legacy_tuned_for_multimodality
      parameters:
        deltaG1_0:
          distribution: normal
          mu: -0.4
          sigma: 0.2
        deltaG4_0:
          distribution: normal
          mu: 0.0
          sigma: 0.2
        deltaG5_0:
          distribution: normal
          mu: 0.0
          sigma: 0.2
        beta_2:
          distribution: uniform
          lower: 0.0
          upper: 1.0
        q:
          distribution: uniform
          lower: 0.0
          upper: 1.0
        Gact2_BF_0:
          distribution: truncated_normal
          mu: 0.7
          sigma: 0.2
          lower: 0.0
        Gact2_LH_0:
          distribution: truncated_normal
          mu: 0.7
          sigma: 0.2
          lower: 0.0

    CO_BF_ER_LH: &legacy_co_bf_er_lh_prior
      provenance: legacy_tuned_for_multimodality
      parameters:
        deltaG1_0:
          distribution: truncated_normal
          mu: 0.0
          sigma: 2
          lower: -2
          upper: 1
        deltaG4_0:
          distribution: truncated_normal
          mu: 0.0
          sigma: 2
          lower: -2
          upper: 2
        deltaG5_0:
          distribution: truncated_normal
          mu: 0.0
          sigma: 2
          lower: -2
          upper: 2
        beta_2_BF: # Bounded between 0 and 1
          distribution: truncated_normal
          mu: 0.5
          sigma: 1
          lower: 0.0
          upper: 1.0
        beta_2_ER: # Bounded between 0 and 1 
          distribution: truncated_normal
          mu: 0.5
          sigma: 1
          lower: 0.0
          upper: 1.0
        q: # Bounded between 0 and 1 
          distribution: truncated_normal
          mu: 0.5
          sigma: 1
          lower: 0.0
          upper: 1.0
        Gact1_0:
          distribution: truncated_normal
          mu: 0.5
          sigma: 1
          lower: 0.0 # Preventing values smaller than 0
          upper: 1.0 # High enough for ~0 reaction rate
        Gact2_BF_0:
          distribution: truncated_normal
          mu: 0.7
          sigma: 1
          lower: 0.0 # Preventing values smaller than 0
          upper: 1.0 # High enough for ~0 reaction rate
        Gact2_ER_0:
          distribution: truncated_normal
          mu: 0.7
          sigma: 1
          lower: 0.0 # Preventing values smaller than 0
          upper: 1.0 # High enough for ~0 reaction rate
        Gact2_LH_0:
          distribution: truncated_normal
          mu: 0.7
          sigma: 1
          lower: 0.0 # Preventing values smaller than 0 
          upper: 1.0 # High enough for ~0 reaction rate 

  Ag25Pd75: *legacy_alloy_prior_profile
  Ag50Pd50: *legacy_alloy_prior_profile
  Ag75Pd25: *legacy_alloy_prior_profile
  Ag90Pd10: *legacy_alloy_prior_profile

  Pd100:
    CO_ER_LH:
      provenance: legacy_tuned_for_multimodality
      parameters:
        deltaG1_0:
          distribution: truncated_normal
          mu: -0.4
          sigma: 0.2
          lower: -0.4
          upper: 0.0
        deltaG4_0:
          distribution: normal
          mu: 0.0
          sigma: 0.2
        beta_2_ER:
          distribution: uniform
          lower: 0.0
          upper: 1.0
        Gact1_0:
          distribution: truncated_normal
          mu: 0.7
          sigma: 0.2
          lower: 0.0
          upper: 1.0
        Gact2_ER_0:
          distribution: truncated_normal
          mu: 0.7
          sigma: 0.2
          lower: 0.5
          upper: 0.8
        Gact2_LH_0:
          distribution: truncated_normal
          mu: 0.7
          sigma: 0.2
          lower: 0.5
          upper: 1.0

    BF_LH: *legacy_bf_lh_prior
    CO_BF_ER_LH: *legacy_co_bf_er_lh_prior
