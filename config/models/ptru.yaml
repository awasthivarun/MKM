# Unified Pt100 / PtRu fits. Acidic and basic data must never be combined.
dataset_name: PtRu_COOx
temperature_K: 293.15
materials: [Pt100, Pt50Ru50, Pt66Ru33]
media:
  acidic:
    dataset_name: PtRu_COOx_acidic
    selected_data: data/processed/PtRu_COOx_acidic/analysis/PtRu_COOx_acidic_selected.parquet
  basic:
    dataset_name: PtRu_COOx_basic
    selected_data: data/processed/PtRu_COOx_basic/analysis/PtRu_COOx_basic_selected.parquet

gas:
  standard_state_pressure_bar: 1.0
  total_pressure_bar: 1.0
electrolyte:
  standard_state_concentration_M: 1.0
  activity_model: ideal_molarity
surface_composition:
  Pt100: {Ru_fraction: 0.0}
  Pt66Ru33: {Ru_fraction: 0.3333333333333333}
  Pt50Ru50: {Ru_fraction: 0.5}
mechanisms: [CO_LH, CO_ER, CO_BF, CO_ER_LH, CO_BF_LH, CO_BF_ER, CO_BF_ER_LH]
mechanism_assumptions:
  CO_adsorption: finite_rate_SSA_on_Pt
  OH_adsorption: quasi_equilibrium_on_Pt_and_Ru
  COOH_coverage: negligible
  CO_saturation_coverage: 1.0
  acid_OH_source: water
  base_OH_source: hydroxide
  Ru_OH_discharge_electrons: 1.0
  BF_coupling: chemical_no_electron_transfer
  BF_neighbor_availability: nominal_Ru_surface_fraction
  rate_normalization: per_Pt_CO_adsorption_site
  surface_composition_equals_nominal: approximation
priors:
  path: config/priors/ptru.yaml
likelihood:
  name: rate_normal
  sigma_form: sigma_abs + sigma_rel * model_rate
  supported_error_structures: [shared, material]
  sigma_abs_prior_median_s_inv: 0.0002
  sigma_abs_prior_log_sd: 0.5
  sigma_rel_prior_median: 0.2
  sigma_rel_prior_log_sd: 0.5

# All-material fits allow shared, independent, or linear composition-dependent physical parameters.
parameterizations:
  shared: {}
  independent: {independent_materials: true}
  linear_xRu:
    x_reference: 0.25
    slopes:
      deltaG1_0: {distribution: truncated_normal, mu: 0.0, sigma: 0.20, lower: -1.0, upper: 1.0}
      deltaG4_0: {distribution: truncated_normal, mu: 0.0, sigma: 0.20, lower: -1.0, upper: 1.0}
      deltaG5_0: {distribution: truncated_normal, mu: 0.0, sigma: 0.20, lower: -1.0, upper: 1.0}
      Gact1_0: {distribution: truncated_normal, mu: 0.0, sigma: 0.20, lower: -1.0, upper: 1.0}
      Gact2_BF_0: {distribution: truncated_normal, mu: 0.0, sigma: 0.20, lower: -1.0, upper: 1.0}
      Gact2_ER_0: {distribution: truncated_normal, mu: 0.0, sigma: 0.20, lower: -1.0, upper: 1.0}
      Gact2_LH_0: {distribution: truncated_normal, mu: 0.0, sigma: 0.20, lower: -1.0, upper: 1.0}
      # Fraction of maximum physically admissible slope for bounded beta.
      beta_2_ER: {distribution: truncated_normal, mu: 0.0, sigma: 0.30, lower: -1.0, upper: 1.0}
