
# Pt100 CO oxidation: independent acidic and basic Bayesian fits.
# Uses the shared AgPd inference infrastructure.

dataset_name: PtRu_COOx
temperature_K: 293.15

materials:
  - Pt100

media:
  acidic:
    dataset_name: PtRu_COOx_acidic
    selected_data: data/processed/PtRu_COOx_acidic/analysis/PtRu_COOx_acidic_selected.parquet

  basic:
    dataset_name: PtRu_COOx_basic
    selected_data: data/processed/PtRu_COOx_basic/analysis/PtRu_COOx_basic_selected.parquet

gas:
  standard_state_pressure_bar: 1.0
  total_pressure_bar: 1.0

electrolyte:
  standard_state_concentration_M: 1.0
  activity_model: ideal_molarity
  pKw: 14.167

mechanisms:
  - CO_LH
  - CO_ER
  - CO_ER_LH

mechanism_assumptions:
  CO_adsorption: finite_rate_SSA
  OH_adsorption: quasi_equilibrium
  COOH_coverage: negligible
  CO_saturation_coverage: 1.0
  acid_OH_source: water
  base_OH_source: hydroxide

priors:
  path: config/priors/pt100.yaml

likelihood:
  name: rate_normal
  sigma_form: sigma_abs + sigma_rel * model_rate
  supported_error_structures:
    - shared

  sigma_abs_prior_median_s_inv: 0.0002
  sigma_abs_prior_log_sd: 0.5
  sigma_rel_prior_median: 0.2
  sigma_rel_prior_log_sd: 0.5
