co_coverage_cap:
  # Fixed molecular CO coverage caps for the two fixed-cap models. The fitted-cap calibration below ignores these values.
  # CO adsorption is multiplied by 1 - theta_CO / theta_CO_max while the ordinary Pd site balance
  # theta_empty_Pd + theta_OH_Pd + theta_CO = 1 is retained.
  # Kept material-resolved so the assumed packing limit can vary by composition.
  Pd100: 0.66
  Ag10Pd90: 0.66
  Ag25Pd75: 0.66
  Ag50Pd50: 0.66
  Ag75Pd25: 0.66
  Ag90Pd10: 0.66

## Do not use -  Sensitivity analysis to see best values of CO coverage caps. 
