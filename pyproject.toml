[build-system]
requires = ["setuptools>=80,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "mkm"
version = "0.1.0"
description = "Bayesian microkinetic modeling of electrochemical CO oxidation"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "arviz>=1.3,<1.4",
    "arviz-base>=1.3,<1.4",
    "arviz-plots>=1.3,<1.4",
    "arviz-stats>=1.3,<1.4",
    "h5netcdf>=1.8,<2",
    "h5py>=3.16,<4",
    "matplotlib>=3.11,<3.12",
    "numba>=0.66,<0.67",
    "numpy>=2.4,<2.5",
    "nutpie>=0.16.11,<0.17",
    "openpyxl>=3.1,<4",
    "pandas>=3.0,<3.1",
    "pyarrow>=25,<26",
    "pymc>=6.3,<6.4",
    "pytensor>=3.3,<3.4",
    "PyYAML>=6.0,<7",
    "scipy>=1.18,<1.19",
    "xarray>=2026.7,<2027",
]

[project.optional-dependencies]
dev = [
    "black>=26.5,<27",
    "ipykernel>=7.3,<8",
    "pytest>=9.1,<10",
]

[project.urls]
Repository = "https://github.com/awasthivarun/MKM"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 120
target-version = ["py313"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: cross-module or command-line workflow tests",
    "plotting: figure-generation smoke tests",
    "sampling: tests that run posterior sampling",
    "slow: tests excluded from fast development checks",
]
